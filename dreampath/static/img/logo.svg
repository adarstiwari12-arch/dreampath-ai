<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 48" aria-label="DreamPath AI">
  <defs>
    <linearGradient id="dp-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="dp-logo-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <style>
      .dp-brand-text { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.03em; }
      .dp-brand-sub { fill: #0284c7; font-weight: 800; }
      .dp-brand-badge { fill: #e0f2fe; stroke: #bae6fd; }
      .dp-brand-badge-txt { fill: #0369a1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; }
    </style>
  </defs>
  <!-- Brand mark icon -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="url(#dp-logo-grad)"/>
    <path d="M 8 31 C 13 31, 14 21, 20 21 C 25 21, 26 10, 31 10" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="21" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="31" cy="10" r="3.6" fill="url(#dp-logo-accent)" stroke="#ffffff" stroke-width="1.5"/>
  </g>
  <!-- Wordmark: Default dark text for maximum contrast on light backgrounds -->
  <text x="56" y="32" class="dp-brand-text">
    DreamPath<tspan class="dp-brand-sub">AI</tspan>
  </text>
  <!-- EdTech Tag Pill -->
  <g transform="translate(222, 14)">
    <rect width="48" height="20" rx="10" class="dp-brand-badge" stroke-width="1"/>
    <text x="24" y="14" text-anchor="middle" class="dp-brand-badge-txt">PRO</text>
  </g>
</svg>
